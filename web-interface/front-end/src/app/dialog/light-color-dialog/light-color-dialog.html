<div class="container">
  <button (click)="onNoClick()" class="close-button" mat-icon-button tabindex="-1">
    <span class="material-symbols-rounded">close</span>
  </button>

  <div class="info">
    <div class="color-picker-container">
      <label>Choose Display Color</label>

      <mat-form-field appearance="outline" class="full-width">
        <mat-select [(ngModel)]="selectedColor">
          <mat-select-trigger>
            <div class="option-container">
              <span class="color-swatch" [style.background-color]="getSelectedColorColor()"></span>
              <span>{{ selectedColor }}</span>
            </div>
          </mat-select-trigger>

          @for (color of COLORS; track color.name) {
            <mat-option [value]="color.name">
              <div class="option-container">
                <span class="color-swatch" [style.background-color]="color.hex"></span>
                <span>{{ color.name }}</span>
              </div>
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div class="buttons">
    <button (click)="onYesClick()" class="gray-button finish">Set</button>
    <button (click)="onNoClick()" class="white-danger-button finish">Cancel</button>
  </div>
</div>
