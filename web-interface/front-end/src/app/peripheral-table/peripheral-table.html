<table mat-table matSort [dataSource]="dataSource" class="mat-elevation-z2 striped-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
    <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
  </ng-container>

  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
    <td mat-cell *matCellDef="let element">
      {{ element.type }}
    </td>
  </ng-container>

  <ng-container matColumnDef="graph">
    <th mat-header-cell *matHeaderCellDef> Graph </th>
    <td mat-cell *matCellDef="let element">
      @if (element.grafanaUrl) {
        <button (click)="openGrafanaGraph(element.grafanaUrl)" class="table-btn">Show graph</button>
      }
    </td>
  </ng-container>

  @if (anyAction) {
    <ng-container matColumnDef="actuator-actions">
      <th mat-header-cell *matHeaderCellDef> Actuator actions </th>
      <td mat-cell *matCellDef="let element">
        @if (element.action) {
          <button (click)="element.action.callback()" class="table-btn">{{ element.action.name }}</button>
        }
      </td>
    </ng-container>
  }

  <ng-container matColumnDef="current-state">
    <th mat-header-cell *matHeaderCellDef> Current state </th>
    <td mat-cell *matCellDef="let element">
      {{ element.currentState() }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
